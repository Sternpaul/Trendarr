name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  # Weekly run catches newly disclosed vulnerabilities even without code changes
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Syntax check
        run: for f in src/*.js scripts/*.js; do node --check "$f"; done

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --pull -t trendarr:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trendarr:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
