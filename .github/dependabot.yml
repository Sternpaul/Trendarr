version: 2
updates:
  # npm dependencies (security + version updates, minor/patch grouped into one PR)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Docker base image (e.g. node:24-alpine -> node:26-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Odd-numbered Node releases never become LTS and go EOL after ~8 months
      - dependency-name: "node"
        versions: [">=25 <26", ">=27 <28", ">=29 <30", ">=31 <32"]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
